name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run astro check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/about/
            http://localhost:4321/services/
            http://localhost:4321/elements/
            http://localhost:4321/insights/
            http://localhost:4321/contact/
            http://localhost:4321/privacy/
            http://localhost:4321/terms/
            http://localhost:4321/accessibility/
          budgetPath: .lighthouseci/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  links:
    name: Check Links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Run preview server
        run: bun run preview &
        env:
          PORT: 4321

      - name: Wait for preview
        run: npx --yes wait-on http://localhost:4321 --timeout 30000

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose http://localhost:4321/
          fail: true

  p0-critical:
    name: P0 Critical Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run preview server
        run: bun run preview &
        env:
          PORT: 4321

      - name: Wait for preview
        run: npx --yes wait-on http://localhost:4321 --timeout 30000

      - name: Run P0 critical tests
        run: bunx playwright test tests/p0-critical.spec.ts

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run E2E tests
        run: bun run preview --port 4321 & sleep 5 && bunx playwright test tests/e2e/ && kill %1

  p1-accessibility:
    name: P1 Accessibility Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run preview server
        run: bun run preview &
        env:
          PORT: 4321

      - name: Wait for preview
        run: npx --yes wait-on http://localhost:4321 --timeout 30000

      - name: Run P1 accessibility tests
        run: bunx playwright test tests/p1-accessibility.spec.ts

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: [build, lighthouse, links, p0-critical, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/ --project-name=serviceparadigm-com
