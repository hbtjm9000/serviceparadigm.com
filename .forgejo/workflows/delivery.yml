# Delivery Pipeline — serviceparadigm.com
# Single-job pipeline (runner can't schedule multi-job dep chains)
# Phases: CI → CD → Production, step-gated by branch + AGY score
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  STAGING_DIR: /var/www/serviceparadigm.stage.paradigm.local
  FORGEJO_BASE: http://127.0.0.1:3020
  FORGEJO_REPO: hbtjm/serviceparadigm.com

defaults:
  run:
    shell: bash -e {0}

jobs:
  delivery:
    runs-on: docker
    container: crumbs-ci:latest
    steps:

      # ── Setup ───────────────────────────────────────────────────────
      - name: Checkout
        run: |
          git init .
          git remote add origin http://hbtjm:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3020/${{ env.FORGEJO_REPO }}.git
          git fetch --depth 1 origin $GITHUB_SHA && git checkout -f $GITHUB_SHA

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --no-cache 2>&1 && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      # ═════════════════════════════════════════════════════════════════
      # PHASE 1: CI  —  all pushes + PRs to main
      # Gate: AGY self-correct (score >= 5 to proceed)
      # ═════════════════════════════════════════════════════════════════
      - name: Type check
        run: bun run typecheck:ci

      - name: Lint
        run: bun run lint || echo "Lint warnings (non-blocking)"

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build
        id: build

      - name: AGY Review
        id: review
        run: |
          if [ -f scripts/agy-review.ts ]; then
            npx ts-node scripts/agy-review.ts > review.txt
            cat review.txt
            SCORE=$(grep -Eo '[0-9]+/5' review.txt | head -1 | cut -d'/' -f1)
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "AGY Score: $SCORE/5"
          else
            echo "score=5" >> $GITHUB_OUTPUT
            echo "AGY review script not found — defaulting score=5"
          fi

      - name: Create AGY issue if score < 5
        if: steps.review.outputs.score != '' && steps.review.outputs.score < 5
        run: |
          TITLE="AGY Review Score ${{ steps.review.outputs.score }}/5 – Needs Fix"
          BODY=$(cat review.txt)
          curl -sf -X POST "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/issues" \
            -H "Authorization: token ${{ secrets.FORGEJOTOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'title':sys.argv[1],'body':sys.argv[2]}))" "$TITLE" "$BODY")"
          echo "AGY issue created — self-correct cron picks it up"

      # ═════════════════════════════════════════════════════════════════
      # PHASE 2: CD  —  push to main only, AGY score >= 5
      # Deploy staging → BDD → E2E → Lighthouse → promotion PR
      # ═════════════════════════════════════════════════════════════════
      - name: Gate — CD conditions
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Not push to main — CD skipped"
          elif [ "${{ steps.review.outputs.score }}" != "" ] && [ "${{ steps.review.outputs.score }}" -lt 5 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "AGY score ${{ steps.review.outputs.score }}/5 < 5 — CD skipped"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "CD conditions met"
          fi

      - name: Build dist for staging
        if: steps.gate.outputs.skip == 'false'
        run: |
          bun run build
          echo "Dist: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      - name: Deploy to staging
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p $STAGING_DIR
          rm -rf $STAGING_DIR/dist
          cp -r dist $STAGING_DIR/
          chmod -R 755 $STAGING_DIR/dist
          echo "Deployed $GITHUB_SHA at $(date -u '+%Y-%m-%d %H:%M UTC')" > $STAGING_DIR/REVISION
          echo "Staging ready: $(find $STAGING_DIR/dist -type f | wc -l) files"

      - name: Health check (Caddy)
        if: steps.gate.outputs.skip == 'false'
        run: |
          for i in $(seq 1 10); do
            sleep 1
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:80 -H 'Host: serviceparadigm.stage.paradigm.local' 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging healthy via Caddy (HTTP $STATUS)"
              exit 0
            fi
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip == 'false'
        run: |
          PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright \
            bunx playwright install chromium chromium-headless-shell --no-shell 2>&1 | tail -5

      - name: Start preview (serving staging dist)
        if: steps.gate.outputs.skip == 'false'
        run: |
          npx serve $STAGING_DIR/dist -p 4321 -L &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:4321 >/dev/null 2>&1 && echo "Preview ready" && break
            sleep 1
          done

      - name: BDD against staging
        if: steps.gate.outputs.skip == 'false'
        run: |
          BASE_URL=http://127.0.0.1:4321 \
            bunx cucumber-js tests/features/ \
            --require tests/features/steps/*.ts \
            --format summary 2>&1

      - name: E2E against staging
        if: steps.gate.outputs.skip == 'false'
        run: |
          bunx playwright test tests/e2e/ --reporter=list 2>&1

      - name: Lighthouse against staging
        if: steps.gate.outputs.skip == 'false'
        run: |
          npx lighthouse http://127.0.0.1:4321 \
            --output json --output html \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo 2>&1 | tail -30

      - name: Create/update promotion PR
        if: steps.gate.outputs.skip == 'false'
        run: |
          SHA_SHORT=$(echo $GITHUB_SHA | head -c 7)
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          PR_TITLE="Promotion: serviceparadigm.com ${SHA_SHORT} — ${NOW}"

          EXISTING=$(curl -sf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/pulls?base=production&head=main&state=open" 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo 0)

          if [ "$EXISTING" -gt 0 ]; then
            echo "Promotion PR already exists — skipping creation"
            exit 0
          fi

          PR_BODY="## Release Promotion: serviceparadigm.com

          **Commit:** \`$GITHUB_SHA\`
          **Date:** $NOW

          ### Validation
          | Gate | Status |
          |------|--------|
          | CI (typecheck, lint, unit, build) | ✅ |
          | AGY Review | ✅ |
          | Staging deploy | ✅ |
          | BDD | ✅ |
          | E2E | ✅ |
          | Lighthouse | ✅ |

          ### Deploy Options
          Merge this PR to trigger production deploy.

          | Option | Action |
          |--------|--------|
          | **A — GitHub only** | Push to \`origin/production\` |
          | **B — Both** | Push to GitHub + deploy to Cloudflare Pages |

          Deploy runs automatically on merge. Cloudflare deploy is non-blocking.
          _Auto-generated by pipeline._"

          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
          import json,sys
          d={'title': sys.argv[1], 'body': sys.argv[2], 'base': 'production', 'head': 'main'}
          print(json.dumps(d))
          " "$PR_TITLE" "$PR_BODY")" \
            "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/pulls"

          echo "Promotion PR created"

      # ═════════════════════════════════════════════════════════════════
      # PHASE 3: Production  —  push to production
      # Build → GitHub (always) → Cloudflare (non-blocking)
      # ═════════════════════════════════════════════════════════════════
      - name: Production build
        if: github.ref_name == 'production'
        run: bun run build

      - name: Deploy to GitHub
        if: github.ref_name == 'production'
        run: |
          git remote add github https://${{ secrets.GH_TOKEN }}@github.com/hbtjm9000/serviceparadigm.com.git 2>/dev/null || true
          git push github production
          echo "Pushed to GitHub (origin/production) — Option A or B"

      - name: Deploy to Cloudflare Pages
        if: github.ref_name == 'production'
        continue-on-error: true
        run: |
          bunx wrangler pages deploy dist/ \
            --project-name=serviceparadigm \
            --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
