# Delivery Pipeline — serviceparadigm.com
# Single-job pipeline: CI phase → AGY review → CD phase (gated by score >= 5)
# Self-correct loop: AGY issue → coding agent → fix → push → re-trigger CI
# Loop exits when score == 5/5 or max 5 turns reached
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  STAGING_DIR: /var/www/serviceparadigm.stage.paradigm.local
  FORGEJO_BASE: http://127.0.0.1:3020
  FORGEJO_REPO: hbtjm/serviceparadigm.com
  SONAR_TOKEN: squ_97ce209af29740a986ea08e5b396e8050c8b23fc

defaults:
  run:
    shell: bash -e {0}

jobs:
  quality:
    runs-on: docker
    container: crumbs-ci:latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin http://hbtjm:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3020/${{ env.FORGEJO_REPO }}.git
          git fetch --depth 1 origin $GITHUB_SHA && git checkout -f $GITHUB_SHA
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --no-cache 2>&1 && break
            echo "bun install attempt $i failed, retrying..." && sleep 5
          done
      - name: Type check
        run: bun run typecheck:ci
      - name: Lint
        run: bun run lint || echo "Lint warnings"
      - name: Unit tests
        run: bun run test:unit
      - name: SonarQube analysis
        run: |
          sonar-scanner \
            -Dsonar.projectKey=paradigm_serviceparadigm \
            -Dsonar.sources=src/ \
            -Dsonar.host.url=http://sonar.paradigm.local \
            -Dsonar.javascript.node.maxspace=4096
        continue-on-error: true
      - name: Build
        run: bun run build

      # ─── Self-correct: AGY review + issue creation ───
      - name: Run AGY review
        id: review
        run: |
          npx ts-node scripts/agy-review.ts > review.txt
          cat review.txt
          SCORE=$(grep -Eo '[0-9]+/5' review.txt | head -1 | cut -d'/' -f1)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "AGY Score: $SCORE/5"
      - name: Create issue if score < 5
        if: steps.review.outputs.score < 5
        run: |
          TITLE="AGY Review Score ${{ steps.review.outputs.score }}/5 – Needs Fix"
          BODY=$(cat review.txt)
          curl -sf -X POST "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/issues" \
            -H "Authorization: token ${{ secrets.FORGEJOTOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'title':sys.argv[1],'body':sys.argv[2]}))" "$TITLE" "$BODY")"

      # ─── CD phase: deploy + test (only main, score >= 5) ───
      - name: Check deploy conditions
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "main" ]; then
            echo "Not a push to main — skipping CD"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.review.outputs.score }}" -lt 5 ]; then
            echo "Score ${{ steps.review.outputs.score }}/5 < 5 — skipping CD"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Deploy conditions met"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Build production dist
        if: steps.gate.outputs.skip == 'false'
        run: |
          bun run build
          echo "Dist files: $(find dist -type f | wc -l)"
          ls -lh dist/
      - name: Deploy to staging
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p $STAGING_DIR
          rm -rf $STAGING_DIR/dist
          cp -r dist $STAGING_DIR/
          chmod -R 755 $STAGING_DIR/dist
          echo "Deployed $GITHUB_SHA at $(date -u '+%Y-%m-%d %H:%M UTC')" > $STAGING_DIR/REVISION
      - name: Health check (via Caddy)
        if: steps.gate.outputs.skip == 'false'
        run: |
          for i in $(seq 1 10); do
            sleep 1
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:80 -H 'Host: serviceparadigm.stage.paradigm.local' 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging healthy via Caddy (HTTP $STATUS)"
              exit 0
            fi
          done
          echo "Health check failed — Caddy may need a reload"
          exit 1
      - name: Install Playwright browsers
        if: steps.gate.outputs.skip == 'false'
        run: |
          PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright \
            bunx playwright install chromium chromium-headless-shell --no-shell 2>&1 | tail -5
      - name: Run P0 critical tests
        if: steps.gate.outputs.skip == 'false'
        run: |
          npx serve $STAGING_DIR/dist -p 4321 -L &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:4321 >/dev/null 2>&1 && echo "preview ready on :4321" && break
            sleep 1
          done
          bunx playwright test tests/p0-critical.spec.ts --reporter=list 2>&1
      - name: Run E2E tests
        if: steps.gate.outputs.skip == 'false'
        run: |
          npx serve $STAGING_DIR/dist -p 4321 -L &
          sleep 2
          bunx playwright test tests/e2e/ --reporter=list 2>&1
      - name: Run BDD scenarios
        if: steps.gate.outputs.skip == 'false'
        run: |
          npx serve $STAGING_DIR/dist -p 4322 -L &
          sleep 2
          BASE_URL=http://127.0.0.1:4322 bunx cucumber-js tests/features/ \
            --require tests/features/steps/*.ts \
            --format summary 2>&1
      - name: Create promotion PR
        if: steps.gate.outputs.skip == 'false'
        run: |
          RELEASE_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          SHA_SHORT=$(echo $GITHUB_SHA | head -c 7)
          PR_TITLE="Release: serviceparadigm.com ${SHA_SHORT} — ${RELEASE_DATE}"
          EXISTING=$(curl -sf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/pulls?base=production&head=main&state=open" 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo 0)
          if [ "$EXISTING" -gt 0 ]; then
            echo "Promotion PR already exists — skipping creation"
            exit 0
          fi
          PR_BODY=$(cat <<'BODYEOF'
          ## Release Promotion: serviceparadigm.com

          **Commit:** `$GITHUB_SHA`
          **Date:** $RELEASE_DATE

          ### Verification

          | Gate | Status |
          |------|--------|
          | Quality Gates | ✅ |
          | Build | ✅ |
          | Deploy staging | ✅ |
          | E2E tests | ✅ |
          | BDD tests | ✅ |

          ### Deploy

          All gates passed — merge this PR, then deploy from the host:

          ```bash
          cd ~/lab/serviceparadigm.com
          git checkout production && git pull
          bun install && bun run build
          rm -rf ~/.paradigm/serviceparadigm.com/dist
          cp -r dist ~/.paradigm/serviceparadigm.com/dist
          echo "Deployed: $SHA_SHORT"
          ```

          _Auto-generated by pipeline_
          BODYEOF
          )
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; d={\"title\":sys.argv[1],\"body\":sys.argv[2],\"base\":\"production\",\"head\":\"main\"}; print(json.dumps(d))" "$PR_TITLE" "$PR_BODY")" \
            "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/pulls"
          echo "Promotion PR created"

  promote:
    runs-on: docker
    container: crumbs-ci:latest
    if: github.event_name == 'push' && github.ref_name == 'production'
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin http://hbtjm:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3020/${{ env.FORGEJO_REPO }}.git
          git fetch --depth 1 origin $GITHUB_SHA && git checkout -f $GITHUB_SHA
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --no-cache 2>&1 && break
            echo "bun install attempt $i failed, retrying..." && sleep 5
          done
      - name: Build
        run: bun run build
      - name: Verify build
        run: |
          echo "Dist files: $(find dist -type f | wc -l)"
          ls -lh dist/
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping Cloudflare deploy"
            exit 0
          fi
          bunx wrangler pages deploy dist/ \
            --project-name=serviceparadigm-com \
            --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true
