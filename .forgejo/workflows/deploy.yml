# Deploy Pipeline — serviceparadigm.com
# Production: build → GitHub push (always) → Cloudflare Pages (non-blocking)
# Triggers on push to production (merge of promotion PR)
on:
  push:
    branches: [production]

defaults:
  run:
    shell: bash -e {0}

jobs:
  deploy:
    runs-on: docker
    container: crumbs-ci:latest
    steps:

      - name: Checkout
        run: |
          git init .
          git remote add origin http://hbtjm:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3020/hbtjm/serviceparadigm.com.git
          git fetch --depth 1 origin refs/heads/production:production
          git checkout production

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --no-cache 2>&1 && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Production build
        run: bun run build

      - name: Deploy to GitHub (origin/production)
        continue-on-error: true
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          # netrc + GIT_TERMINAL_PROMPT=0 to fully bypass credential helper
          echo "machine github.com login ${{ secrets.GH_TOKEN }} password x-oauth-basic" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global http.https://github.com/.extraHeader "Authorization: Basic $(echo -n git:${{ secrets.GH_TOKEN }} | base64 -w0)"
          git push https://github.com/hbtjm9000/serviceparadigm.com.git HEAD:production 2>&1 || \
          git push https://${{ secrets.GH_TOKEN }}@github.com/hbtjm9000/serviceparadigm.com.git HEAD:production 2>&1 || \
          echo 'GitHub push failed (non-fatal)'

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        run: |
          bunx wrangler pages deploy dist/ \
            --project-name=serviceparadigm-com \
            --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
