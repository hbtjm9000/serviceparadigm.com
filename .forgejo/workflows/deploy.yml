# Deploy Pipeline — serviceparadigm.com
# Production: build → GitHub push (always) → Cloudflare Pages (non-blocking)
# Triggers on push to production (merge of promotion PR)
on:
  push:
    branches: [production]

defaults:
  run:
    shell: bash -e {0}

jobs:
  deploy:
    runs-on: docker
    container: crumbs-ci:latest
    steps:

      - name: Checkout
        run: |
          git init .
          git remote add origin http://hbtjm:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3020/hbtjm/serviceparadigm.com.git
          git fetch --depth 1 origin refs/heads/production:production
          git checkout production

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --no-cache 2>&1 && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      - name: Production build
        run: bun run build

      - name: Deploy to GitHub (origin/production)
        continue-on-error: true
        run: |
          # Push via GitHub API to avoid container git credential helper issues
          BRANCH_SHA=$(git rev-parse production)
          curl -sf -X PATCH "https://api.github.com/repos/hbtjm9000/serviceparadigm.com/git/refs/heads/production" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$BRANCH_SHA\",\"force\":true}"
          echo "Pushed to GitHub via API"

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        run: |
          bunx wrangler pages deploy dist/ \
            --project-name=serviceparadigm-com \
            --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
