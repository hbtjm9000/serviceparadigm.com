# CI Pipeline — serviceparadigm.com
# quality gates → AGY self-correct → promotion PR
# Single-job (runner can't schedule multi-job dep chains)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORGEJO_BASE: http://127.0.0.1:3020
  FORGEJO_REPO: hbtjm/serviceparadigm.com

defaults:
  run:
    shell: bash -e {0}

jobs:
  ci:
    runs-on: docker
    container: crumbs-ci:latest
    steps:

      - name: Checkout
        run: |
          git init .
          git remote add origin http://hbtjm:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3020/${{ env.FORGEJO_REPO }}.git
          git fetch --depth 1 origin $GITHUB_SHA && git checkout -f $GITHUB_SHA

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install --no-cache 2>&1 && break
            echo "Attempt $i failed, retrying in 5s..." && sleep 5
          done

      # ── Quality gates ───────────────────────────────────────
      - name: Type check
        run: bun run typecheck:ci

      - name: Lint
        run: bun run lint || echo "Lint warnings (non-blocking)"

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      # ── AGY self-correct gate ────────────────────────────────
      - name: AGY Review
        id: review
        run: |
          if [ -f scripts/agy-review.ts ]; then
            npx ts-node scripts/agy-review.ts > review.txt
            cat review.txt
            SCORE=$(grep -Eo '[0-9]+/5' review.txt | head -1 | cut -d'/' -f1)
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "AGY Score: $SCORE/5"
          else
            echo "score=5" >> $GITHUB_OUTPUT
            echo "AGY review script not found — defaulting score=5"
          fi

      - name: Create AGY issue (score < 5)
        if: steps.review.outputs.score != '' && steps.review.outputs.score < 5
        run: |
          TITLE="AGY Review Score ${{ steps.review.outputs.score }}/5 – Needs Fix"
          BODY=$(cat review.txt)
          curl -sf -X POST "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/issues" \
            -H "Authorization: token ${{ secrets.FORGEJOTOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'title':sys.argv[1],'body':sys.argv[2]}))" "$TITLE" "$BODY")"
          echo "AGY issue created — self-correct cron picks it up"

      # ── Promotion PR (score >= 5, push to main only) ────────
      - name: Create/update promotion PR
        if: steps.review.outputs.score != '' && steps.review.outputs.score >= 5 && github.event_name == 'push' && github.ref_name == 'main'
        run: |
          SHA_SHORT=$(echo $GITHUB_SHA | head -c 7)
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          PR_TITLE="Promotion: serviceparadigm.com ${SHA_SHORT} — ${NOW}"

          EXISTING=$(curl -sf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/pulls?base=production&head=main&state=open" 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo 0)

          if [ "$EXISTING" -gt 0 ]; then
            echo "Promotion PR already exists — skipping creation"
            exit 0
          fi

          PR_BODY="## Release Promotion: serviceparadigm.com

          **Commit:** \`$GITHUB_SHA\`
          **Date:** $NOW

          ### CI Gates
          | Gate | Status |
          |------|--------|
          | Type check | ✅ |
          | Lint | ✅ |
          | Unit tests | ✅ |
          | Build | ✅ |
          | AGY Review | ✅ |

          ### CD Validation
          Validation (staging deploy → BDD → E2E → Lighthouse) runs automatically
          against this PR. Check the **Validate** workflow for results.

          ### Deploy Options
          Merge this PR to trigger production deploy.

          | Option | Action |
          |--------|--------|
          | **A — GitHub only** | Push to \`origin/production\` |
          | **B — Both** | Push to GitHub + deploy to Cloudflare Pages |

          _Auto-generated by CI pipeline._"

          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
          import json,sys
          d={'title': sys.argv[1], 'body': sys.argv[2], 'base': 'production', 'head': 'main'}
          print(json.dumps(d))
          " "$PR_TITLE" "$PR_BODY")" \
            "${{ env.FORGEJO_BASE }}/api/v1/repos/${{ env.FORGEJO_REPO }}/pulls"

          echo "Promotion PR created"

      - name: CI complete (no promotion PR — not all conditions met)
        if: steps.review.outputs.score == '' || steps.review.outputs.score < 5 || github.event_name != 'push' || github.ref_name != 'main'
        run: echo "CI finished. Promotion PR not created (AGY score < 5, or PR event, or not on main)."
